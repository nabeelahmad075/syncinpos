<!-- Navbar -->
<nav
  class="main-header navbar navbar-expand navbar-white navbar-light drop-shadow"
  style="
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    margin-left: 0px !important;
  "
>
  <ul class="navbar-nav ml-auto flex space-x-4">
    <!-- Custom Navbar Content -->
    <!-- <pos-nav-menu></pos-nav-menu> -->
    <header-date></header-date>
    <pos-navbar></pos-navbar>
  </ul>
</nav>

<!-- Main Content Area -->
<div class="flex content h-screen pt-16 bg-[#dbe3ea]">
  <!-- Added padding to prevent overlap with navbar -->
  <div class="flex-1 flex flex-row mb-1 mt-[-0.2rem]">
    <!-- SECTION-1 -->
    <div
      class="w-56 bg-[#FDFDFD] rounded-r-lg p-4 flex items-center justify-center mr-1"
    >
      <!-- <p class="text-xl font-bold text-[#374151]">Categories</p> -->
       <p-listBox
      [options]="tblCategory"
      [(ngModel)] = "categoryId"
      (ngModelChange)="getItemsByCategory()"
       ></p-listBox>
    </div>

    <div class="flex-1 flex flex-col">
      <!-- Message SECTION -->
      <!-- <div
      class="h-[1.3rem] bg-transparent flex items-center justify-center rounded-lg mb-1"
    >
      <p class="text-sm font-bold text-red-600 mt-3">Software License Will Be Expired After 1 Day(s). 
        Please Pay Monthly Subscription Fee To Continue Uninterpreted Services. Thank You!</p>
    </div> -->

      <!-- SECTION-5 -->
      <div class="border border-gray-300 rounded-lg mb-0 overflow-hidden">
        <!-- SECTION-2 -->
        <div class="bg-[#FDFDFD] h-12">
          <p class="text-xl font-bold">Buttons</p>
        </div>

        <div class="h-[35.5rem] bg-[#FDFDFD]">
          <p-listBox
            [options]="tblItems"
            ></p-listBox>
        </div>

        <!-- SECTION-3 -->
        <div class="bg-[#FDFDFD] h-12">
          <p class="text-xl font-bold">Buttons</p>
        </div>
      </div>
    </div>

    <!-- SECTION-4 -->
    <div
      class="w-1/3 bg-[#FDFDFD] rounded-l-lg p-4 flex items-center justify-center ml-1"
    >
      <p class="text-xl font-bold">Order Information</p>
    </div>
  </div>
</div>
