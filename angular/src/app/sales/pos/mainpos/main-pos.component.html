<!-- Navbar -->
<nav
  class="main-header navbar navbar-expand navbar-white navbar-light drop-shadow"
  style="
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    margin-left: 0px !important;
  "
>
  <ul class="navbar-nav ml-auto flex space-x-4">
    <!-- Custom Navbar Content -->
    <!-- <pos-nav-menu></pos-nav-menu> -->
    <header-date></header-date>
    <pos-navbar></pos-navbar>
  </ul>
</nav>

<!-- Main Content Area -->
<div class="flex content h-screen pt-16 bg-[#dbe3ea]">
  <!-- Added padding to prevent overlap with navbar -->
  <div class="flex-1 flex flex-row mb-1 mt-[-0.2rem]">
    <!-- LEFT CONTAINER START -->
    <div class="w-56 bg-[#FDFDFD] rounded-r-lg p-2 flex mr-1">
      <tabset class="w-full">
        <tab heading="Category">
          <div class="h-full bg-transparent">
            <p-listBox
              [options]="tblCategory"
              [(ngModel)]="categoryId"
              (ngModelChange)="getItemsByCategory()"
            ></p-listBox>
          </div>
        </tab>
        <tab heading="Deals"></tab>
      </tabset>
    </div>
    <!-- LEFT CONTAINER END -->

    <div class="flex-1 flex flex-col">
      <!-- Message SECTION -->
      <!-- <div
      class="h-[1.3rem] bg-transparent flex items-center justify-center rounded-lg mb-1"
    >
      <p class="text-sm font-bold text-red-600 mt-3">Software License Will Be Expired After 1 Day(s). 
        Please Pay Monthly Subscription Fee To Continue Uninterpreted Services. Thank You!</p>
    </div> -->

      <!-- CENTER CONTAINER -->
      <div class="border border-gray-300 rounded-lg mb-0 overflow-hidden">
        <!-- SECTION-2 -->
        <div class="bg-[#FDFDFD] h-12 p-2">
          <p class="text-xl font-bold">Buttons</p>
        </div>
        <!-- ITEM LIST SECTION START -->
        <div class="h-[35.5rem] bg-[#FDFDFD] p-2">
          <div class="flex flex-wrap gap-2">
            <button
              *ngFor="let item of tblItems"
              (click)="onItemClick(item.value)"
              [ngClass]="{'bg-blue-500 text-white': selectedItem === item.value, 'bg-gray-300 hover:bg-gray-400': selectedItem !== item.value}"
              class="px-4 py-2 bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold rounded"
            >
              {{ item.label }}
            </button>
          </div>
        </div>
        <!-- ITEM LIST SECTION END -->

        <!-- SECTION-3 -->
        <div class="bg-[#FDFDFD] h-12 p-2">
          <p class="text-xl font-bold">Buttons</p>
        </div>
      </div>
    </div>

    <!-- RIGHT CONTAINER -->
    <div class="w-1/3 bg-[#FDFDFD] rounded-l-lg p-2 flex flex-col gap-y-5 ml-1">
      <!-- SERVICE TYPE BUTTONS START -->
      <div
        class="w-full flex justify-between items-center h-3 gap-x-2 mt-[0.7rem]"
      >
        <button
          class="flex-1 h-[2.5rem] justify-center bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded inline-flex items-center"
        >
          <i class="fa-solid fa-utensils fill-current w-4 h-4 mr-2"></i>
          <span>Dine In</span>
        </button>
        <button
          class="flex-1 h-[2.5rem] justify-center bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded inline-flex items-center"
        >
          <i class="fa-solid fa-bread-slice fill-current w-4 h-4 mr-2"></i>
          <span>Takeaway</span>
        </button>
        <button
          class="flex-1 h-[2.5rem] justify-center bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded inline-flex items-center"
        >
          <svg
            class="fill-current w-4 h-4 mr-2"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
          >
            <path
              d="M16 1.2C15 1.2 14.2 2 14.2 3S15 4.8 16 4.8 17.8 4 17.8 3 17 1.2 16 1.2M12.4 4.1C11.93 4.1 11.5 4.29 11.2 4.6L7.5 8.29C7.19 8.6 7 9 7 9.5C7 10.13 7.33 10.66 7.85 10.97L11.2 13V18H13V11.5L10.75 9.85L13.07 7.5L14.8 10H19V8.2H15.8L13.86 4.93C13.57 4.43 13 4.1 12.4 4.1M10 3H3C2.45 3 2 2.55 2 2S2.45 1 3 1H12.79C12.58 1.34 12.41 1.71 12.32 2.11C11.46 2.13 10.65 2.45 10 3M5 12C2.24 12 0 14.24 0 17S2.24 22 5 22 10 19.76 10 17 7.76 12 5 12M5 20.5C3.07 20.5 1.5 18.93 1.5 17S3.07 13.5 5 13.5 8.5 15.07 8.5 17 6.93 20.5 5 20.5M19 12C16.24 12 14 14.24 14 17S16.24 22 19 22 24 19.76 24 17 21.76 12 19 12M19 20.5C17.07 20.5 15.5 18.93 15.5 17S17.07 13.5 19 13.5 22.5 15.07 22.5 17 20.93 20.5 19 20.5M5.32 11H1C.448 11 0 10.55 0 10S.448 9 1 9H5.05C5.03 9.16 5 9.33 5 9.5C5 10.03 5.12 10.54 5.32 11M6 7H2C1.45 7 1 6.55 1 6S1.45 5 2 5H7.97L6.09 6.87C6.05 6.91 6 6.96 6 7Z"
            />
          </svg>
          <span>Delivery</span>
        </button>
      </div>
      <!-- SERVICE TYPE BUTTONS END -->
      <!-- ORDER TAKER & KOT NUMBER TEXTBOX START -->
      <div class="w-full flex justify-between items-center gap-x-2">
        <p-select
          name="ordertaker"
          placeholder="Order Taker"
          class="flex-1 h-[2.4rem] text-sm border-2 border-gray-200 rounded shadow-none mt-0 leading-none"
        >
        </p-select>
        <input
          type="text"
          placeholder="Manual KOT/Token Number"
          class="flex-1 h-[2.5rem] border-2 border-gray-200 py-2 px-2 rounded text-sm"
        />
      </div>
      <!-- ORDER TAKER & KOT NUMBER TEXTBOX END -->
      <!-- ORDER GRID START -->
      <div class="w-full flex justify-between items-center gap-x-2 mt-[-1rem]">
        <p-table>
          <ng-template pTemplate="header">
            <tr class="text-sm">
              <th class="p-1.5 w-[17rem] border-2 border-solid border-black">
                Item Name
              </th>
              <th
                class="p-1.5 w-[3.5rem] text-center border-2 border-solid border-black"
              >
                Qty
              </th>
              <th
                class="p-1.5 w-[3.5rem] text-center border-2 border-solid border-black"
              >
                Rate
              </th>
              <th
                class="p-1.5 w-[3.5rem] text-center border-2 border-solid border-black"
              >
                Amount
              </th>
              <th
                class="p-1.5 w-[3.5rem] text-center border-2 border-solid border-black"
              >
                Action
              </th>
            </tr>
          </ng-template>
        </p-table>
      </div>
      <!-- ORDER GRID END -->
    </div>
  </div>
</div>
