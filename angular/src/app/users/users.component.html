<div [@routerTransition]>
  <section class="content-header" style="padding: 1px 0.5rem">
    <div class="container-fluid" style="width: 97%; margin-top: 5px">
      <div class="row">
        <div class="col-6">
          <h4>{{ "Users" | localize }}</h4>
        </div>
        <div class="col-6 text-right">
          <!-- <a class="btn button-new" (click)="createLocation()">
            <i class="fa fa-plus hover:animate-spin"></i>
            Create
          </a> -->
        </div>
      </div>
    </div>
  </section>
  <div class="container-fluid" style="width: 97%">
    <div class="card main-content rounded">
      <div class="card-content table-bordered">
        <p-table
          #dataTable
          [value]="primengTableHelper.records"
          [lazy]="true"
          [scrollable]="true"
          [style]="{ width: '100%', fontSize: '0.8rem' }"
          (onLazyLoad)="getHistory($event)"
          class="p-table-page table-sm table-hover"
          [rows]="primengTableHelper.defaultRecordsCountPerPage"
        >
          <ng-template pTemplate="caption">
            <div class="d-flex flex-row-reverse">
              <span>
                <input
                  [style]="{ width: '100%', fontSize: '0.8rem' }"
                  pInputText
                  type="text"
                  class="table-search-input form-control w-100"
                  (input)="
                    dataTable.filterGlobal($event.target.value, 'contains')
                  "
                  placeholder="Search"
                />
              </span>
            </div>
          </ng-template>
          <ng-template pTemplate="header">
            <tr>
              <th>Employee Code</th>
              <th>Full Name</th>
              <th>Username</th>
              <th>Role</th>
              <th style="text-align: center">Status</th>
              <th style="text-align: center">Action</th>
            </tr>
          </ng-template>
          <ng-template pTemplate="body" let-userHistory>
            <tr>
              <td>{{ userHistory.surName }}</td>
              <td>{{ userHistory.name }}</td>
              <td>{{ userHistory.username }}</td>
              <td>{{ userHistory.roleAssigned }}</td>
              <td style="text-align: center">
                <div class="custom-control custom-checkbox">
                  <input
                    type="checkbox"
                    class="custom-control-input"
                    disabled
                    [checked]="userHistory.isActive"
                  />
                  <label class="custom-control-label"></label>
                </div>
              </td>
              <!-- <td style="text-align: center">
                <a
                  type="button"
                  class="mx-2 edit-btn"
                  (click)="editLocation(locationHistory)"
                >
                  <i class="fa fa-pencil"></i>
                </a> 
                <a
                type="button"
                class="mx-2 edit-btn"
                (click)="editUser(userHistory)"
                >
                <i class="fas fa-pencil-alt"></i>
                {{ "Edit" | localize }}
              </a>
              <a
                type="button"
                class="mx-2 edit-btn"
                (click)="resetPassword(userHistory)"
                >
                <i class="fas fa-lock"></i>
              </a>
              </td>-->
              <td style="text-align: center">
                <p-menu
                  #menu
                  [model]="items"
                  [popup]="true"
                  appendTo="body"
                ></p-menu>
                <p-button
                  class="p-menu-dots"
                  (click)="performAction(userHistory, menu, $event)"
                  icon="pi pi-ellipsis-v"
                ></p-button>
              </td>
            </tr>
          </ng-template>
        </p-table>

        <div
          class="card-footer table-card-footer text-center my-2"
          *ngIf="primengTableHelper.totalRecordsCount == 0"
        >
          <p class="p-0 m-0">No Data</p>
        </div>
        <span class="" style="margin-left: 15px; font-size: 0.9rem">
          {{ primengTableHelper.totalRecordsCount | number : "2." }} records
          found!
        </span>
        <div class="">
          <p-paginator
            [rows]="primengTableHelper.defaultRecordsCountPerPage"
            #paginator
            (onPageChange)="getHistory($event)"
            [totalRecords]="primengTableHelper.totalRecordsCount"
            [rowsPerPageOptions]="
              primengTableHelper.predefinedRecordsCountPerPage
            "
          >
          </p-paginator>
        </div>
      </div>
    </div>
  </div>
</div>
